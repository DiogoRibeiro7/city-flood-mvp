version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "diogoribeiro7"
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "diogoribeiro7"
    groups:
      web-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/infra/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "diogoribeiro7"

  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "diogoribeiro7"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "diogoribeiro7"
