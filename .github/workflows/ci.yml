name: ci

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  POETRY_VERSION: "2.2.1"

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked tools
        id: tools
        run: |
          mkdir -p test-results/static
          python -m pip install "poetry==$POETRY_VERSION" 2>&1 | tee test-results/static/bootstrap.log
          poetry install --no-interaction --no-ansi 2>&1 | tee test-results/static/install.log
          poetry run python --version | tee test-results/static/python.txt
          git rev-parse HEAD > test-results/static/revision.txt
      - name: Lint
        run: poetry run ruff check . 2>&1 | tee test-results/static/lint.log
      - name: Format
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: poetry run ruff format --check . 2>&1 | tee test-results/static/format.log
      - name: Types
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: poetry run mypy src scripts/export_openapi.py scripts/database_test_support.py scripts/smoke_stack.py scripts/seed_smoke.py scripts/release_manifest.py 2>&1 | tee test-results/static/types.log
      - name: Validate workflows
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color 2>&1 | tee test-results/static/workflows.log
      - name: Retain static diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: static-checks
          path: test-results/static/
          retention-days: 14

  backend:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16.11-ts2.25.0-all-oss
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: floodmvp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d floodmvp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          mkdir -p test-results/backend
          python -m pip install "poetry==$POETRY_VERSION" 2>&1 | tee test-results/backend/bootstrap.log
          poetry install --no-interaction --no-ansi 2>&1 | tee test-results/backend/install.log
          poetry run python --version | tee test-results/backend/python.txt
          poetry run pip freeze > test-results/backend/packages.txt
          git rev-parse HEAD > test-results/backend/revision.txt
      - name: Unit tests including the public schema snapshot
        run: poetry run pytest -q tests/unit --junitxml=test-results/backend/unit.xml 2>&1 | tee test-results/backend/unit.log
      - name: PostgreSQL integration and migration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/floodmvp_test
        run: poetry run pytest -q tests/integration tests/migrations --junitxml=test-results/backend/postgres.xml 2>&1 | tee test-results/backend/postgres.log
      - name: Database diagnostics
        if: failure()
        run: |
          mkdir -p test-results/backend
          docker logs "${{ job.services.postgres.id }}" > test-results/backend/postgres-container.log 2>&1
      - name: Retain results for this Python version
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-python-${{ matrix.python }}
          path: test-results/backend/
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: |
          mkdir -p ../test-results/web
          npm install --global corepack@0.35.0 2>&1 | tee ../test-results/web/bootstrap.log
          corepack enable
          corepack yarn install --immutable 2>&1 | tee ../test-results/web/install.log
          node --version | tee ../test-results/web/node.txt
          corepack yarn --version | tee ../test-results/web/yarn.txt
      - name: Typecheck
        run: corepack yarn typecheck 2>&1 | tee ../test-results/web/typecheck.log
      - name: Build
        run: corepack yarn build --outDir ../test-results/web/dist 2>&1 | tee ../test-results/web/build.log
      - name: Retain web build and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-checks
          path: test-results/web/
          retention-days: 14

  full-stack:
    needs: [static, web]
    uses: ./.github/workflows/smoke-stack.yml
    with:
      check_failure_path: false
