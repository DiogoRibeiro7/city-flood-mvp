name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.4

      - name: Install deps
        run: |
          poetry config virtualenvs.create true
          poetry install --no-interaction --no-ansi

      - name: Lint
        run: |
          poetry run ruff check .
          poetry run mypy src

      - name: Tests
        run: poetry run pytest -q tests/unit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: |
            web/.yarn/cache
            web/.yarn/unplugged
            web/.yarn/build-state.yml
            web/.yarn/install-state.gz
          key: yarn-${{ runner.os }}-${{ hashFiles('web/yarn.lock') }}

      - name: Install deps
        run: |
          corepack enable
          corepack prepare yarn@4.1.1 --activate
          yarn install --immutable

      - name: Build
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build -f infra/backend/Dockerfile .

      - name: Build web image
        run: docker build -f web/Dockerfile web

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start stack
        run: docker compose up -d --build db backend web prometheus grafana

      - name: Wait for web
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:5173/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Web did not become ready in time."
          docker compose ps
          docker compose logs web --tail=200
          exit 1

      - name: Seed demo data
        run: bash ./scripts/seed_all.sh
        env:
          TELEMETRY_REALISM: synthetic
          TELEMETRY_DAYS: "1"
          PIPE_TELEMETRY_LIMIT: "10"
          ANALYTICS_PIPE_LIMIT: "25"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: |
            web/.yarn/cache
            web/.yarn/unplugged
            web/.yarn/build-state.yml
            web/.yarn/install-state.gz
          key: yarn-${{ runner.os }}-${{ hashFiles('web/yarn.lock') }}

      - name: Install web deps
        run: |
          corepack enable
          corepack prepare yarn@4.1.1 --activate
          yarn install --immutable
        working-directory: web

      - name: Install Playwright browser
        run: yarn playwright install chromium
        working-directory: web

      - name: Capture screenshots
        run: yarn capture:screenshots
        working-directory: web
        env:
          SCREENSHOT_MODE: light

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: docs/screenshots/*.png
