[tool.poetry]
name = "city-flood-mvp"
version = "0.1.0"
description = "Synthetic city flood monitoring MVP: FastAPI + TimescaleDB + PostGIS + web app"
authors = ["You <you@example.com>"]
readme = "README.md"
packages = [{include = "floodmvp", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.129.0"
uvicorn = {version="^0.41.0", extras=["standard"]}
pydantic = "^2.9.2"
pydantic-settings = "^2.13.0"
sqlalchemy = "^2.0.36"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.18.4"
geoalchemy2 = "^0.18.1"
shapely = "^2.0.6"
numpy = "^2.1.3"
pandas = "^3.0.0"
python-dateutil = "^2.9.0.post0"
httpx = "^0.28.1"
prometheus-client = "^0.24.1"
cdsapi = "^0.7.7"
xarray = "^2026.2.0"
netcdf4 = "^1.7.2"
pyjwt = "^2.9.0"
starlette = "^0.52.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^1.3.0"
ruff = "^0.15.1"
mypy = "^1.11.2"
types-python-dateutil = "^2.9.0.20241003"
pre-commit = "^4.5.1"
pyyaml = "^6.0.2"
pandas-stubs = "^3.0.0.260204"
types-shapely = "^2.0.0.20240223"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
