          - river_segment
          - node
          - pipe
          - outfall
          - rain_gauge
          - river_gauge
          - tank
          - pump
          title: Asset Type
        name:
          type: string
          title: Name
        geom_geojson:
          anyOf:
          - additionalProperties: true
