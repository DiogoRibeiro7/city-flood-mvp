components:
  schemas:
    AnalyticsEventDiffSummary:
      properties:
        base_count:
          type: integer
          title: Base Count
        compare_count:
          type: integer
          title: Compare Count
        added:
          items:
            $ref: '#/components/schemas/EventOut'
          type: array
          title: Added
        removed:
          items:
            $ref: '#/components/schemas/EventOut'
          type: array
          title: Removed
      type: object
      required:
      - base_count
      - compare_count
      title: AnalyticsEventDiffSummary
    AnalyticsHotspotDiffSummary:
      properties:
        base_count:
          type: integer
          title: Base Count
        compare_count:
          type: integer
          title: Compare Count
        changed:
          items:
            $ref: '#/components/schemas/HotspotDiffItem'
          type: array
          title: Changed
        added:
          items:
            $ref: '#/components/schemas/HotspotDiffItem'
          type: array
          title: Added
        removed:
          items:
            $ref: '#/components/schemas/HotspotDiffItem'
          type: array
          title: Removed
      type: object
      required:
      - base_count
      - compare_count
      title: AnalyticsHotspotDiffSummary
    AnalyticsRunDiffOut:
      properties:
        city_id:
          type: string
          title: City Id
        base_run_id:
          type: string
          title: Base Run Id
        compare_run_id:
          type: string
          title: Compare Run Id
        base_version:
          type: string
          title: Base Version
        compare_version:
          type: string
          title: Compare Version
        metrics_delta:
          additionalProperties: true
          type: object
          title: Metrics Delta
        events:
          $ref: '#/components/schemas/AnalyticsEventDiffSummary'
        hotspots:
          $ref: '#/components/schemas/AnalyticsHotspotDiffSummary'
      type: object
      required:
      - city_id
      - base_run_id
      - compare_run_id
      - base_version
      - compare_version
      - metrics_delta
      - events
      - hotspots
      title: AnalyticsRunDiffOut
    AnalyticsRunOut:
      properties:
        run_id:
          type: string
          title: Run Id
        city_id:
          type: string
          title: City Id
        start_ts:
          type: string
          format: date-time
          title: Start Ts
        end_ts:
          type: string
          format: date-time
          title: End Ts
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
        params:
          additionalProperties: true
          type: object
          title: Params
        metrics:
          additionalProperties: true
          type: object
          title: Metrics
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - run_id
      - city_id
      - start_ts
      - end_ts
      - status
      - version
      - params
      - metrics
      - created_at
      - updated_at
      title: AnalyticsRunOut
    AssetOut:
      properties:
        asset_id:
          type: string
          title: Asset Id
        city_id:
          type: string
          title: City Id
        asset_type:
          type: string
