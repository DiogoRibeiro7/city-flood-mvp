openapi: 3.1.0
info:
  title: City Flood MVP API
  version: 0.1.0
paths:
  /metrics:
    get:
      summary: Metrics
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health V1 Health Get
  /v1/cities:
    get:
      tags:
      - cities
      summary: Cities
      operationId: cities_v1_cities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CityOut'
                type: array
                title: Response Cities V1 Cities Get
              example:
              - city_id: city_porto_mvp
                name: Porto
                country: PT
        '400':
          $ref: '#/components/responses/InvalidArgument'
  /v1/cities/{city_id}:
    get:
      tags:
      - cities
      summary: City
      operationId: city_v1_cities__city_id__get
      parameters:
      - name: city_id
        in: path
        required: true
        schema:
          type: string
          title: City Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityOut'
              example:
                city_id: city_porto_mvp
                name: Porto
                country: PT
        '404':
          content:
            application/json:
              example:
                error:
                  code: CITY_NOT_FOUND
                  message: City not found
                  details:
                    city_id: city_missing
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/cities/{city_id}/assets:
    get:
      tags:
      - assets
      summary: City Assets
      operationId: city_assets_v1_cities__city_id__assets_get
      parameters:
      - name: city_id
        in: path
        required: true
        schema:
          type: string
          title: City Id
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: asset_type filter
          title: Type
        description: asset_type filter
      - name: bbox
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: minLon,minLat,maxLon,maxLat (WGS84, non-wrapping extent)
          title: Bbox
        description: minLon,minLat,maxLon,maxLat (WGS84, non-wrapping extent)
      - name: near
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: WGS84 lon,lat for radial search
          title: Near
        description: WGS84 lon,lat for radial search
      - name: radius_m
        in: query
        required: false
        schema:
          type: number
          maximum: 50000
          minimum: 1
          default: 500.0
          title: Radius M
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: tag filter key:value (repeatable)
          title: Tag
        description: tag filter key:value (repeatable)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 2000
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetOut'
                title: Response City Assets V1 Cities  City Id  Assets Get
              example:
              - asset_id: pipe_123
                city_id: city_porto_mvp
                asset_type: pipe
                name: Pipe 0001
                geom_geojson:
                  type: LineString
                  coordinates:
                  - - -8.69
                    - 41.07
                  - - -8.68
                    - 41.08
                props:
                  diameter_m: 0.5
                  material: PVC
        '400':
          content:
            application/json:
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: bbox must be 'minLon,minLat,maxLon,maxLat'
                  details: {}
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/assets/{asset_id}:
    get:
      tags:
      - assets
      summary: Asset
      operationId: asset_v1_assets__asset_id__get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetOut'
              example:
                asset_id: pipe_123
                city_id: city_porto_mvp
                asset_type: pipe
                name: Pipe 0001
                geom_geojson:
                  type: LineString
                  coordinates:
                  - - -8.69
                    - 41.07
                  - - -8.68
                    - 41.08
                props:
                  diameter_m: 0.5
                  material: PVC
        '404':
          content:
            application/json:
              example:
                error:
                  code: ASSET_NOT_FOUND
                  message: Asset not found
                  details:
                    asset_id: asset_missing
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/assets/{asset_id}/upstream:
    get:
      tags:
      - assets
      summary: Asset Upstream
      operationId: asset_upstream_v1_assets__asset_id__upstream_get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      - name: depth
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 3
          title: Depth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetOut'
                title: Response Asset Upstream V1 Assets  Asset Id  Upstream Get
        '404':
          content:
            application/json:
              example:
                error:
                  code: ASSET_NOT_FOUND
                  message: Asset not found
                  details:
                    asset_id: asset_missing
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/assets/{asset_id}/downstream:
    get:
      tags:
      - assets
      summary: Asset Downstream
      operationId: asset_downstream_v1_assets__asset_id__downstream_get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      - name: depth
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 3
          title: Depth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetOut'
                title: Response Asset Downstream V1 Assets  Asset Id  Downstream Get
        '404':
          content:
            application/json:
              example:
                error:
                  code: ASSET_NOT_FOUND
                  message: Asset not found
                  details:
                    asset_id: asset_missing
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/telemetry/scenarios:
    get:
      tags:
      - telemetry
      summary: Telemetry Scenarios
      operationId: telemetry_scenarios_v1_telemetry_scenarios_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ScenarioRunOut'
                type: array
                title: Response Telemetry Scenarios V1 Telemetry Scenarios Get
              example:
              - scenario_id: scenario_123
                name: heavy_rain_high_river
                start_ts: '2026-02-01T00:00:00Z'
                end_ts: '2026-02-02T00:00:00Z'
        '400':
          $ref: '#/components/responses/InvalidArgument'
  /v1/telemetry/qa:
    get:
      tags:
      - telemetry
      summary: Telemetry Qa
      operationId: telemetry_qa_v1_telemetry_qa_get
      parameters:
      - name: city_id
        in: query
        required: true
        schema:
          type: string
          title: City Id
      - name: day
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD
          title: Day
        description: YYYY-MM-DD
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryQaOut'
                title: Response Telemetry Qa V1 Telemetry Qa Get
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/assets/{asset_id}/metrics:
    get:
      tags:
      - telemetry
      summary: Metrics
      operationId: metrics_v1_assets__asset_id__metrics_get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      - name: scenario_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: scenario id or 'latest'
          title: Scenario Id
        description: scenario id or 'latest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                title: Response Metrics V1 Assets  Asset Id  Metrics Get
              example:
              - fill_ratio
              - flow_m3s
        '404':
          content:
            application/json:
              example:
                error:
                  code: SCENARIO_NOT_FOUND
                  message: Scenario not found
                  details: {}
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/assets/{asset_id}/observations:
    get:
      tags:
      - telemetry
      summary: Observations
      operationId: observations_v1_assets__asset_id__observations_get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      - name: metric
        in: query
        required: true
        schema:
          type: string
          title: Metric
      - name: from
        in: query
        required: true
        schema:
          type: string
          title: From
      - name: to
        in: query
        required: true
        schema:
          type: string
          title: To
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          description: Timescale time_bucket interval, e.g. 1m,5m,1h
          default: 5m
          title: Granularity
        description: Timescale time_bucket interval, e.g. 1m,5m,1h
      - name: agg
        in: query
        required: false
        schema:
          type: string
          description: avg|min|max
          default: avg
          title: Agg
        description: avg|min|max
      - name: include_gaps
        in: query
        required: false
        schema:
          type: boolean
          description: include empty buckets as null values
          default: false
          title: Include Gaps
        description: include empty buckets as null values
      - name: scenario_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: scenario id or 'latest'
          title: Scenario Id
        description: scenario id or 'latest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationsOut'
              example:
                metric: fill_ratio
                series:
                - ts: '2026-02-01T10:00:00Z'
                  value: 0.42
                - ts: '2026-02-01T10:05:00Z'
                  value: 0.55
                request_id: req_example
        '400':
          content:
            application/json:
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: '''to'' must be after ''from'''
                  details: {}
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              example:
                error:
                  code: SCENARIO_NOT_FOUND
                  message: Scenario not found
                  details: {}
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/assets/{asset_id}/observations:compare:
    get:
      tags:
      - telemetry
      summary: Observations Compare
      operationId: observations_compare_v1_assets__asset_id__observations_compare_get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      - name: metric
        in: query
        required: true
        schema:
          type: string
          title: Metric
      - name: from
        in: query
        required: true
        schema:
          type: string
          title: From
      - name: to
        in: query
        required: true
        schema:
          type: string
          title: To
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          description: Timescale time_bucket interval, e.g. 1m,5m,1h
          default: 5m
          title: Granularity
        description: Timescale time_bucket interval, e.g. 1m,5m,1h
      - name: agg
        in: query
        required: false
        schema:
          type: string
          description: avg|min|max
          default: avg
          title: Agg
        description: avg|min|max
      - name: base_scenario_id
        in: query
        required: true
        schema:
          type: string
          description: scenario id or 'latest'
          title: Base Scenario Id
        description: scenario id or 'latest'
      - name: compare_scenario_id
        in: query
        required: true
        schema:
          type: string
          description: scenario id or 'latest'
          title: Compare Scenario Id
        description: scenario id or 'latest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioCompareOut'
              example:
                metric: fill_ratio
                base_scenario_id: scenario_base
                compare_scenario_id: scenario_test
                series:
                - ts: '2026-02-01T10:00:00Z'
                  base: 0.42
                  compare: 0.55
                  delta: 0.13
                request_id: req_example
        '400':
          content:
            application/json:
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: '''to'' must be after ''from'''
                  details: {}
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              example:
                error:
                  code: SCENARIO_NOT_FOUND
                  message: Scenario not found
                  details: {}
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/telemetry/events:batch:
    post:
      tags:
      - ingest
      summary: Ingest Events Batch
      operationId: ingest_events_batch_v1_telemetry_events_batch_post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedBearer'
        '400':
          content:
            application/json:
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: type is required
                  details: {}
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              example:
                error:
                  code: ASSET_NOT_FOUND
                  message: Asset not found
                  details:
                    asset_id: asset_missing
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              example:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: Idempotency-Key was already used for a different request
                  details: {}
                  request_id: req_example
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
      - BearerAuth: []
