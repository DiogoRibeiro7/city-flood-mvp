  /v1/cities/{city_id}/status:
    get:
      tags:
      - analytics
      summary: City Status
      operationId: city_status_v1_cities__city_id__status_get
      parameters:
      - name: city_id
        in: path
        required: true
        schema:
          type: string
          title: City Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityStatusOut'
              example:
                city_id: city_porto_mvp
                risk: low
                active_events: 0
                hotspots: 0
                updated_at: '2026-02-02T12:23:13Z'
                request_id: req_example
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/cities/{city_id}/summary:
    get:
      tags:
      - analytics
      summary: City Summary
      operationId: city_summary_v1_cities__city_id__summary_get
      parameters:
      - name: city_id
        in: path
        required: true
        schema:
          type: string
          title: City Id
      - name: minutes
        in: query
        required: false
        schema:
          type: integer
          maximum: 1440
          minimum: 1
          default: 15
          title: Minutes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitySummaryOut'
              example:
                city_id: city_porto_mvp
                now: '2026-02-02T12:00:00Z'
                rain_mmph: 3.2
                river_level_m: 1.8
                status_counts:
                  normal: 120
                  watch: 5
                  warning: 1
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/hotspots:
    get:
      tags:
      - analytics
      summary: Hotspots
      operationId: hotspots_v1_hotspots_get
      parameters:
