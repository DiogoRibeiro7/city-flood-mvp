# Controlled synthetic series test rule semantics, not operational attainment.
rule_files:
- ../../infra/observability/alerts.yml
evaluation_interval: 1m
tests:
- name: real API errors are not diluted by health probes
  interval: 1m
  input_series:
  - series: http_requests_total{job="floodmvp-backend",instance="backend:8000",path="/v1/cities",method="GET",status="200"}
    values: 0+800x30
  - series: http_requests_total{job="floodmvp-backend",instance="backend:8000",path="/v1/cities",method="GET",status="500"}
    values: 0+200x30
  - series: http_requests_total{job="floodmvp-backend",instance="backend:8000",path="/v1/health",method="GET",status="200"}
    values: 0+1000000x30
  alert_rule_test:
  - eval_time: 20m
    alertname: ApiHigh5xxRate
    exp_alerts:
    - exp_labels:
        severity: page
        service: api
      exp_annotations:
        summary: API 5xx fraction above 2%
        description: Inspect request IDs and DB errors. Threshold uses a five-minute window, at least 100 requests, sustained
          for ten minutes; probes are excluded.
        runbook_url: https://github.com/DiogoRibeiro7/city-flood-mvp/blob/develop/docs/runbooks/observability.md#alert-response
- name: zero traffic and low volume are not successful SLO evidence or noisy pages
  interval: 1m
  input_series:
  - series: http_requests_total{job="floodmvp-backend",instance="backend:8000",path="/v1/cities",method="GET",status="500"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: ApiHigh5xxRate
    exp_alerts: []
- name: no error series with real traffic has availability one
  interval: 1m
  input_series:
  - series: http_requests_total{job="floodmvp-backend",instance="backend:8000",path="/v1/cities",method="GET",status="200"}
    values: 0+100x30
  promql_expr_test:
  - expr: floodmvp:api_availability:ratio5m
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="floodmvp:api_availability:ratio5m"}'
      value: 1
- name: backlog remains actionable when worker is down
  interval: 1m
  input_series:
  - series: up{job="floodmvp-worker",instance="worker:9101"}
    values: 0+0x30
  - series: up{job="floodmvp-backend",instance="backend:8000"}
    values: 1+0x30
  - series: job_queue_collection_success{job="floodmvp-backend",instance="backend:8000"}
    values: 1+0x30
  - series: job_queue_collection_timestamp_seconds{job="floodmvp-backend",instance="backend:8000"}
    values: 0+60x30
  - series: job_queue_oldest_due_age_seconds{job="floodmvp-backend",instance="backend:8000",job_type="analytics_run"}
    values: 700+60x30
  alert_rule_test:
  - eval_time: 20m
    alertname: DueJobAgeHigh
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: jobs
        job: floodmvp-backend
        instance: backend:8000
        job_type: analytics_run
      exp_annotations:
        summary: Due unfinished work is older than five minutes
        description: Inspect worker scrape/poll health, retries and pending jobs. This committed backlog can include active
          work because the worker holds its transaction through processing. Do not blindly requeue locked work.
        runbook_url: https://github.com/DiogoRibeiro7/city-flood-mvp/blob/develop/docs/runbooks/observability.md#alert-response
  - eval_time: 20m
    alertname: MetricsTargetDown
    exp_alerts:
    - exp_labels:
        severity: page
        service: monitoring
        job: floodmvp-worker
        instance: worker:9101
      exp_annotations:
        summary: API or worker scrape unavailable
        description: Check the process, private scrape address and network. Missing scrapes are unknown service health, not
          successful requests.
        runbook_url: https://github.com/DiogoRibeiro7/city-flood-mvp/blob/develop/docs/runbooks/observability.md#alert-response
- name: failed collection never turns stale backlog into a fresh alert sample
  interval: 1m
  input_series:
  - series: job_queue_collection_success{job="floodmvp-backend",instance="backend:8000"}
    values: 0+0x30
  - series: job_queue_collection_timestamp_seconds{job="floodmvp-backend",instance="backend:8000"}
    values: 0+0x30
  - series: job_queue_oldest_due_age_seconds{job="floodmvp-backend",instance="backend:8000",job_type="analytics_run"}
    values: 900+0x30
  alert_rule_test:
  - eval_time: 20m
    alertname: DueJobAgeHigh
    exp_alerts: []
  - eval_time: 20m
    alertname: QueueSnapshotUnavailable
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: jobs
        job: floodmvp-backend
        instance: backend:8000
      exp_annotations:
        summary: Committed queue snapshot unavailable or stale
        description: Check PostgreSQL connectivity and query timeouts. Cached backlog values are unusable until collection
          succeeds; do not interpret failure as an empty queue.
        runbook_url: https://github.com/DiogoRibeiro7/city-flood-mvp/blob/develop/docs/runbooks/observability.md#alert-response
- name: feed silence requires explicit live expectation 0
  interval: 1m
  input_series:
  - series: ingest_expected_active{job="floodmvp-backend",instance="backend:8000"}
    values: 0+0x30
  - series: ingest_last_commit_timestamp_seconds{job="floodmvp-backend",instance="backend:8000"}
    values: 0+0x30
  - series: process_start_time_seconds{job="floodmvp-backend",instance="backend:8000"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 20m
    alertname: IngestNoArrivals
    exp_alerts: []
- name: feed silence requires explicit live expectation 1
  interval: 1m
  input_series:
  - series: ingest_expected_active{job="floodmvp-backend",instance="backend:8000"}
    values: 1+0x30
  - series: ingest_last_commit_timestamp_seconds{job="floodmvp-backend",instance="backend:8000"}
    values: 0+0x30
  - series: process_start_time_seconds{job="floodmvp-backend",instance="backend:8000"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 20m
    alertname: IngestNoArrivals
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: ingest
      exp_annotations:
        summary: Expected live feed has no new inserted events
        description: Check producer connectivity and rejection counters. Ten-minute arrival/startup grace sustained five minutes.
          Replays and duplicates do not reset arrival time.
        runbook_url: https://github.com/DiogoRibeiro7/city-flood-mvp/blob/develop/docs/runbooks/observability.md#alert-response
- name: future or slow inserted events count against freshness; duplicates do not count as invalid
  interval: 1m
  input_series:
  - series: ingest_expected_active{job="floodmvp-backend",instance="backend:8000"}
    values: 1+0x30
  - series: ingest_events_total{job="floodmvp-backend",instance="backend:8000",outcome="accepted"}
    values: 0+100x30
  - series: ingest_events_total{job="floodmvp-backend",instance="backend:8000",outcome="duplicate"}
    values: 0+10000x30
  - series: ingest_events_total{job="floodmvp-backend",instance="backend:8000",outcome="invalid"}
    values: 0+0x30
  - series: ingest_event_delay_seconds_bucket{job="floodmvp-backend",instance="backend:8000",le="300.0"}
    values: 0+90x30
  alert_rule_test:
  - eval_time: 20m
    alertname: IngestFreshnessLow
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: ingest
      exp_annotations:
        summary: Fewer than 95% of live API events arrive within five minutes
        description: Check producer clocks, network and timestamp anomalies. Disable live-feed expectations for backfills.
          Five-minute event window, at least 100 inserts, sustained ten minutes.
        runbook_url: https://github.com/DiogoRibeiro7/city-flood-mvp/blob/develop/docs/runbooks/observability.md#alert-response
  - eval_time: 20m
    alertname: IngestInvalidFractionHigh
    exp_alerts: []
- name: terminal failures and slow completions reduce timely analytics success
  interval: 1m
  input_series:
  - series: job_completion_latency_seconds_bucket{job="floodmvp-worker",instance="worker:9101",job_type="analytics_run",outcome="completed",le="300.0"}
    values: 0+8x30
  - series: job_completion_latency_seconds_count{job="floodmvp-worker",instance="worker:9101",job_type="analytics_run",outcome="completed"}
    values: 0+9x30
  - series: job_completion_latency_seconds_count{job="floodmvp-worker",instance="worker:9101",job_type="analytics_run",outcome="failed"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: AnalyticsCompletionLow
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: analytics
      exp_annotations:
        summary: Fewer than 95% of terminal analytics jobs succeeded within five minutes
        description: Inspect committed failures, retries and end-to-end completion latency. One-hour window with at least
          ten terminal jobs, sustained ten minutes. Always inspect due backlog for jobs that never finish.
        runbook_url: https://github.com/DiogoRibeiro7/city-flood-mvp/blob/develop/docs/runbooks/observability.md#alert-response
- name: zero traffic is not a successful availability sample
  interval: 1m
  input_series:
  - series: http_requests_total{job="floodmvp-backend",instance="backend:8000",path="/v1/cities",method="GET",status="200"}
    values: 0+0x30
  promql_expr_test:
  - expr: floodmvp:api_availability:ratio5m >= 0
    eval_time: 20m
    exp_samples: []
  alert_rule_test:
  - eval_time: 20m
    alertname: ApiHigh5xxRate
    exp_alerts: []
