global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: floodmvp-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: floodmvp-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
