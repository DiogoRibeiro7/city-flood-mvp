groups:
  - name: floodmvp-api-slo
    rules:
      - alert: ApiHigh5xxRate
        expr: |
          sum(rate(http_requests_errors_total{status_class="5xx"}[5m]))
          /
          sum(rate(http_requests_total[5m])) > 0.02
        for: 10m
        labels:
          severity: page
          service: api
        annotations:
          summary: "API 5xx rate above 2% (10m)"
          description: "5xx error rate over the last 10 minutes exceeded 2%."

      - alert: ApiLatencyP95High
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_latency_seconds_bucket[5m])) by (le))
          > 0.75
        for: 10m
        labels:
          severity: page
          service: api
        annotations:
          summary: "API p95 latency above 750ms (10m)"
          description: "Overall API p95 latency exceeded 750ms."

      - alert: IngestLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_latency_seconds_bucket{path="/v1/telemetry/events:batch"}[5m])) by (le)
          ) > 1.5
        for: 10m
        labels:
          severity: page
          service: ingest
        annotations:
          summary: "Ingest p95 latency above 1.5s (10m)"
          description: "Ingest endpoint p95 latency exceeded 1.5s."

  - name: floodmvp-analytics-slo
    rules:
      - alert: AnalyticsQueueLagHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(job_queue_age_seconds_bucket{job_type="analytics_run"}[5m])) by (le)
          ) > 300
        for: 15m
        labels:
          severity: page
          service: analytics
        annotations:
          summary: "Analytics job queue lag above 5m (15m)"
          description: "Analytics jobs are waiting too long before processing."

      - alert: AnalyticsJobFailures
        expr: |
          increase(job_queue_failed_total{job_type="analytics_run"}[15m]) > 3
        for: 10m
        labels:
          severity: ticket
          service: analytics
        annotations:
          summary: "Multiple analytics job failures"
          description: "More than 3 analytics jobs failed over the last 15 minutes."

  - name: floodmvp-jobs
    rules:
      - alert: ExportQueueLagHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(job_queue_age_seconds_bucket{job_type="export_csv"}[5m])) by (le)
          ) > 300
        for: 15m
        labels:
          severity: ticket
          service: exports
        annotations:
          summary: "Export queue lag above 5m (15m)"
          description: "Export jobs are waiting too long before processing."

      - alert: JobFailureSpike
        expr: |
          increase(job_queue_failed_total[15m]) > 5
        for: 10m
        labels:
          severity: ticket
          service: jobs
        annotations:
          summary: "Job failures spike"
          description: "More than 5 job failures in the last 15 minutes."
