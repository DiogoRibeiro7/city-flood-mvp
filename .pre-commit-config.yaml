repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff
        name: locked Ruff lint
        entry: poetry run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: locked Ruff formatting
        entry: poetry run ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: poetry run mypy src scripts/export_openapi.py scripts/database_test_support.py scripts/smoke_stack.py scripts/seed_smoke.py scripts/release_manifest.py
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.2.5
    hooks:
      - id: prettier
        files: ^web/
