# Only scripts/smoke_stack.py supplies these variables. No application .env is read.
x-app: &app
  image: ${SMOKE_PROJECT:?Use python -m scripts.smoke_stack}-backend
  environment: &app-env
    APP_ENV: test
    DATABASE_URL: postgresql+asyncpg://postgres:smoke-test-only@db:5432/floodmvp_smoke_test
    INGEST_TOKEN: smoke-ingest-only
    SMOKE_PROJECT: ${SMOKE_PROJECT}
    CITY_IDS: city_porto_mvp
    ANALYTICS_PIPE_LIMIT: "1"
    EXPORT_DIR: /app/data/exports
  volumes:
    - exports:/app/data/exports
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: timescale/timescaledb-ha:pg16.11-ts2.25.0-all-oss
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smoke-test-only
      POSTGRES_DB: floodmvp_smoke_test
    volumes:
      - db_data:/home/postgres/pgdata/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "floodmvp_smoke_test"]
      interval: 2s
      timeout: 2s
      retries: 60

  backend:
    <<: *app
    build:
      context: .
      dockerfile: infra/backend/Dockerfile
    ports:
      - "127.0.0.1::8000"

  worker:
    <<: *app
    command: ["python", "-m", "floodmvp.jobs.queue_worker", "--poll", "0.5"]

  scheduler:
    <<: *app
    command: ["python", "-m", "floodmvp.jobs.scheduler", "--poll-seconds", "2"]

  web:
    image: ${SMOKE_PROJECT}-web
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: ${SMOKE_API_BASE:?Smoke runner resolves the API port}
    ports:
      - "127.0.0.1::5173"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1::9090"

  grafana:
    image: grafana/grafana:10.4.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: smoke-test-only
      GF_SECURITY_ADMIN_USER: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1::3000"

volumes:
  db_data:
  exports:
