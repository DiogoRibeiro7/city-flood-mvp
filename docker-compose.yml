services:
  db:
    image: timescale/timescaledb-ha:pg16.11-ts2.25.0-all-oss
    # The HA image includes PostGIS packages, but extensions must be enabled per DB.
    # See infra/db/init.sql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-floodmvp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/home/postgres/pgdata/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-floodmvp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: infra/backend/Dockerfile
    deploy:
      replicas: 1
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - INGEST_TOKEN=${INGEST_TOKEN:-dev-ingest-token}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
      - APP_ENV=${APP_ENV:-dev}
      - DEPLOYMENT_TENANT_ID=${DEPLOYMENT_TENANT_ID:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ISSUER=${JWT_ISSUER:-}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-}
      - JWT_ROLES_CLAIM=${JWT_ROLES_CLAIM:-roles}
      - JWT_TENANT_CLAIM=${JWT_TENANT_CLAIM:-tenant}
      - ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - INGEST_EXPECTED_ACTIVE=${INGEST_EXPECTED_ACTIVE:-false}
    volumes:
      - exports:/app/data/exports
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/backend/Dockerfile
    command: ["python", "-m", "floodmvp.jobs.queue_worker", "--metrics-host", "0.0.0.0"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_ENV=${APP_ENV:-dev}
      - INGEST_TOKEN=${INGEST_TOKEN:-dev-ingest-token}
    volumes:
      - exports:/app/data/exports
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE=http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=35d"]
    volumes:
      - prometheus_data:/prometheus
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - worker

  grafana:
    image: grafana/grafana:10.4.3
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  db_data:
  exports:
  prometheus_data:
